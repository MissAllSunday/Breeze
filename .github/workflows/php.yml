name: Breeze tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '8.3' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: breeze_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: breeze_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_PREFIX: smf_

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          ini-values: pcov.directory=Sources
          coverage: pcov
          tools: php-cs-fixer, phpunit, phpstan
          extensions: mbstring, curl
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: make install
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent 2>/dev/null; then
              echo 'MySQL is ready!'
              exit 0
            fi
            echo "Waiting for MySQL... (attempt $i/30)"
            sleep 2
          done
          echo 'MySQL failed to start'
          exit 1
      - name: Verify MySQL connection
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT VERSION();"
      - name: Test with phpunit
        run: make test
