# E2E Tests workflow is currently disabled while we investigate CI-specific
# failures. Tests pass locally with `make e2e` but fail in GitHub Actions
# due to Docker build cache / env-var inheritance issues inside the Vite
# dev-server container. See git history for previous implementation.
#
# TODO: Re-enable once a stable CI strategy is chosen (see Makefile e2e target).
#
# Alternatives under consideration:
#   1. Build static files (`vite build`) + serve with nginx, then run
#      Playwright on the host (no Docker-in-Docker dev server).
#   2. Use GitHub Actions `services:` block for DB/API and run app + tests
#      directly on the ubuntu-latest runner.
#   3. Switch to Playwright component tests (`@playwright/experimental-ct-react`)
#      which mount components in isolated browsers without a full backend.

name: E2E Tests (disabled)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: E2E disabled
        run: echo "E2E workflow is disabled. Run make e2e locally instead."
