name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start E2E services
        run: make e2e-up

      - name: Smoke check API (diagnostics)
        run: |
          A=http://localhost:8080
          curl -s "$A/?action=authScenario"; echo
          curl -s "$A/?action=setViewer&id=1&granted=deleteOwnStatus,deleteOwnComments"; echo
          curl -s -w '\nHTTP %{http_code}\n' -X POST "$A/?action=breezeStatus&sa=deleteStatus" \
            -H 'Content-Type: application/json' -d '{"data":{"id":20,"user_id":1}}'
          curl -s "$A/?action=inspect"; echo
          docker exec breeze_e2e_api sh -c 'ls -la /tmp; cat /tmp/breeze_e2e_perm_state.json; echo; php -v | head -1'
          curl -s -o /dev/null -w 'app HTTP %{http_code}\n' http://localhost:3001/

      - name: Run E2E tests
        run: make e2e-test

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Show container status
        if: failure()
        run: docker compose -f docker-compose.e2e.yml ps -a

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down E2E services
        if: always()
        run: make e2e-down
