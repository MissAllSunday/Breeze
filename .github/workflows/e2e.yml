name: E2E Tests

on:
  push:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.app'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'docker-compose.e2e.yml'
      - 'Dockerfile.app'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait db api app

      - name: Run Playwright tests
        run: docker compose -f docker-compose.e2e.yml run --rm e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
